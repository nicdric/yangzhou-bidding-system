<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扬州招标信息管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff}
.container{text-align:center;padding:40px;max-width:500px}
h1{font-size:28px;margin-bottom:30px;text-shadow:0 2px 10px rgba(0,0,0,0.3)}
.spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{color:#aaa;font-size:14px;margin-top:15px}
.error-box{background:#fff;color:#1a1a2e;padding:40px;border-radius:16px;text-align:center}
.error-box h2{color:#e74c3c;margin-bottom:15px}
.error-box p{margin:10px 0;font-size:15px}
.error-box a{color:#0f3460;font-weight:bold;text-decoration:none}
.btn{display:inline-block;background:#0f3460;color:#fff!important;padding:12px 30px;border-radius:8px;font-size:16px;margin-top:20px;text-decoration:none}
.btn:hover{background:#16213e}
.note{background:rgba(255,255,255,.1);padding:20px;border-radius:12px;margin-top:30px;font-size:13px;color:#ccc;line-height:1.8}
</style>
</head>
<body>
<div class="container" id="app">
  <h1>📋 扬州招标信息管理系统</h1>
  <div class="spinner"></div>
  <p>正在加载，请稍候...</p>
  <p class="msg">首次加载可能需要几秒钟</p>
</div>
<script>
(function(){
  var app = document.getElementById('app');
  fetch('https://cdn.jsdelivr.net/gh/nicdric/yangzhou-bidding-system@master/index.html')
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(e){
      app.innerHTML = '<div class="error-box"><h2>❌ 加载失败</h2><p>无法从 CDN 加载页面</p><p style="color:#888;font-size:13px;margin:15px 0">错误: '+e.message+'</p><hr style="border:none;border-top:1px solid #eee;margin:20px 0"><p>可以尝试：</p><p><a href="https://cdn.jsdelivr.net/gh/nicdric/yangzhou-bidding-system@master/index.html" target="_blank">查看源码版本</a></p><p style="margin-top:15px;font-size:13px">或联系管理员获取本地版本</p></div>';
    });
})();
</script>
</body>
</html>
