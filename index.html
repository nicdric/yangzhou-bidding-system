<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扬州招标信息管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        .loading {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            background: white;
            color: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
        }
        .error h2 { margin-bottom: 20px; }
        .error a {
            color: #0f3460;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <h1>📋 扬州招标信息管理系统</h1>
        <div class="spinner"></div>
        <p>正在加载...</p>
    </div>
    <div class="error" id="error" style="display:none">
        <h2>加载失败</h2>
        <p>请尝试直接访问：</p>
        <p><a href="https://cdn.jsdelivr.net/gh/nicdric/yangzhou-bidding-system@master/index.html">jsDelivr CDN</a></p>
    </div>
    <script>
        (async function() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/gh/nicdric/yangzhou-bidding-system@master/index.html');
                if (!response.ok) throw new Error('Network error');
                const html = await response.text();
                
                // 直接替换整个文档
                document.open();
                document.write(html);
                document.close();
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        })();
    </script>
</body>
</html>
